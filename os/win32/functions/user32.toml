[manifest]
callconv = "stdcall"

[prototypes.DLGPROC]
ret = { type = "iptr" }
args = [
    { type = "uptr", name = "hDlg" },
    { type = "u32", name = "uMsg" },
    { type = "uptr", name = "wParam" },
    { type = "iptr", name = "lParam" },
]

[functions.DialogBoxParamA]
ret = { type = "iptr" }
args = [
    { type = "uptr", name = "hInstance" },
    { type = "char", name = "lpTemplateName", mod = "ptr" },
    { type = "uptr", name = "hWndParent" },
    { type = "DLGPROC", name = "lpDialogFunc" },
    { type = "iptr", name = "dwInitParam" },
]

[functions.DialogBoxParamW]
ret = { type = "iptr" }
args = [
    { type = "uptr", name = "hInstance" },
    { type = "char16", name = "lpTemplateName", mod = "ptr" },
    { type = "uptr", name = "hWndParent" },
    { type = "DLGPROC", name = "lpDialogFunc" },
    { type = "iptr", name = "dwInitParam" },
]

[functions.DialogBoxIndirectParamA]
