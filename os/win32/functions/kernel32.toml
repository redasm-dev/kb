[manifest]
callconv = "stdcall"

[functions.ExitProcess]
# cc = "stdcall"
noret = true
ret = { type = "void" }
args = [
    { type = "u32", name = "uExitCode"}
]

[functions.TerminateProcess]
# cc = "stdcall"
noret = true
ret = { type = "bool" }
args = [
    { type = "ptr", name = "hProcess"},
    { type = "u32", name = "uExitCode"}
]

[functions.ExitThread]
# cc = "stdcall"
noret = true
ret = { type = "void" }
args = [
    { type = "u32", name = "dwExitCode" },
]

[functions.RaiseException]
# cc = "stdcall"
noret = true
ret = { type = "void" }
args = [
    { type = "u32", name = "dwExceptionCode" },
    { type = "u32", name = "dwExceptionFlags" },
    { type = "u32", name = "nNumberOfArguments" },
    { type = "ptr", name = "lpArguments" },
]

[functions.GetModuleHandleA]
ret = { type = "uptr" }
args = [
    { type = "char", name = "lpModuleName", mod = "ptr"}
]

[function.CreateFiber]
ret = { type = "uptr", mod = "ptr"}
args = [
    { type = "uptr", name = "dwStackSize"},
    { type = "function", name = "lpStartAddress"},
    { type = "uptr", name = "lpParameter", mod = "ptr"},
]

[function.CreateFiberEx]
ret = { type = "uptr", mod = "ptr"}
args = [
    { type = "uptr", name = "dwStackCommitSize"},
    { type = "uptr", name = "dwStackReserveSize"},
    { type = "uptr", name = "dwFlags"},
    { type = "function", name = "lpStartAddress"},
    { type = "uptr", name = "lpParameter", mod = "ptr"},
]
