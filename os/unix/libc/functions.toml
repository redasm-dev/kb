args = [
    { type = "i32", name = "signum" },
    { type = "SIGNAL_FN", name = "handler" },
]

[functions.qsort]
ret = { type = "void" }
args = [
    { type = "void", name = "base", mod = "ptr" },
    { type = "uptr", name = "nmemb" },
    { type = "uptr", name = "size" },
    { type = "COMPARE_FN", name = "compar" },
]

[functions.bsearch]
ret = { type = "void", mod = "ptr" }
args = [
    { type = "void", name = "key", mod = "ptr" },
    { type = "void", name = "base", mod = "ptr" },
    { type = "uptr", name = "nmemb" },
    { type = "uptr", name = "size" },
    { type = "COMPARE_FN", name = "compar" },
]

[functions.pthread_create]
ret = { type = "i32" }
args = [
    { type = "uptr", name = "thread", mod = "ptr" },
    { type = "void", name = "attr", mod = "ptr" },
    { type = "THREAD_FN", name = "start_routine" },
    { type = "void", name = "arg", mod = "ptr" },
]

