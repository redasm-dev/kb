    { type = "i32", name = "signum" },
]

[prototypes.COMPARE_FN]
ret = { type = "i32" }
args = [
    { type = "void", name = "a", mod = "ptr" },
    { type = "void", name = "b", mod = "ptr" },
]

[prototypes.THREAD_FN]
