    { type = "void", name = "arg", mod = "ptr" },
]

[functions.atexit]
ret = { type = "i32" }
args = [
    { type = "INIT_FN", name = "function" },
]

[functions.at_quick_exit]
ret = { type = "i32" }
args = [
    { type = "INIT_FN", name = "function" },
]

[functions.signal]
