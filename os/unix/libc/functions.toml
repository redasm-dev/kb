[prototypes.MAIN_FN]
ret = { type = "i32" }
args = [
    { type = "i32", name = "argc" },
    { type = "char", name = "argv", mod = "ptr" },
    { type = "char", name = "envp", mod = "ptr" },
]

[prototypes.INIT_FN]
ret = { type = "void" }
args = []

[prototypes.SIGNAL_FN]
ret = { type = "void" }
